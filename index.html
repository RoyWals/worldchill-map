        const lx = rot[0] * hx + rot[1] * hy + rot[2] * hz;
        const ly = rot[4] * hx + rot[5] * hy + rot[6] * hz;
        const lz = rot[8] * hx + rot[9] * hy + rot[10] * hz;
        const phi = Math.asin(Math.max(-1, Math.min(1, ly)));
        const lam = Math.atan2(lx, lz);
        const u = lam / (Math.PI * 2) + 0.5;
        const v = 0.5 - phi / Math.PI;
        return {
          cx: Math.floor(MIN_CX + u * WORLD_W),
          cz: Math.floor(MIN_CZ + v * WORLD_H)
        };
      }
      return null;
    }

    function updateHoverHud(sx, sy) {
      const ch = screenToChunk(sx, sy);
      hoveredChunk = ch;
      if (!ch || ch.cx < MIN_CX || ch.cx > MAX_CX || ch.cz < MIN_CZ || ch.cz > MAX_CZ) {
        document.getElementById("hoverCoords").textContent = "За пределами карты Земли";
        document.getElementById("hoverOwner").textContent = "";
        return;
      }
      const bx = ch.cx * 16 + 8;
      const bz = ch.cz * 16 + 8;
      const bNames = ["Океан", "Побережье", "Горы/Снег", "Лес", "Пустыня", "Равнина"];
      const bName = bNames[biomeAtGrid(ch.cx - MIN_CX, ch.cz - MIN_CZ)] || "Земля";
      document.getElementById("hoverCoords").textContent = `Чанк ${ch.cx}, ${ch.cz} · X:${bx} Z:${bz} (${bName})`;
      const owner = chunkOwnerMap.get(ch.cx + "," + ch.cz);
      const ownerEl = document.getElementById("hoverOwner");
      if (owner) {
        ownerEl.textContent = "⚑ " + owner.name;
        ownerEl.style.color = owner.color || "#38bdf8";
      } else {
        ownerEl.textContent = "Свободная земля";
        ownerEl.style.color = "#94a3b8";
      }
    }

    // ---------------- Mouse / Touch / Keyboard Interactions ----------------
    let dragMode = null; // "pan" | "orbit"
    let dragStart = { x: 0, y: 0 };
    let dragMoved = false;

    ovCanvas.addEventListener("contextmenu", e => e.preventDefault());
    ovCanvas.addEventListener("pointerdown", e => {
      ovCanvas.setPointerCapture(e.pointerId);
      dragStart = { x: e.clientX, y: e.clientY };
      dragMoved = false;
      if (viewMode === "25d" && (e.button === 2 || e.button === 1 || e.shiftKey)) {
        dragMode = "orbit";
      } else {
        dragMode = "pan";
      }
      ovCanvas.classList.add("dragging");
    });

    ovCanvas.addEventListener("pointermove", e => {
      updateHoverHud(e.clientX, e.clientY);
      if (!dragMode) return;
      const dx = e.clientX - dragStart.x;
      const dy = e.clientY - dragStart.y;
      if (Math.hypot(dx, dy) > 3) dragMoved = true;
      dragStart = { x: e.clientX, y: e.clientY };

      if (viewMode === "2d") {
        cam2d.targetCx -= dx / cam2d.zoom;
        cam2d.targetCz -= dy / cam2d.zoom;
        cam2d.cx = cam2d.targetCx;
        cam2d.cz = cam2d.targetCz;
      } else if (viewMode === "25d") {
        if (dragMode === "orbit") {
          cam25.targetYaw -= dx * 0.0065;
          cam25.targetPitch = Math.max(0.24, Math.min(1.36, cam25.targetPitch + dy * 0.0055));
        } else {
          const spd = 0.45 / cam25.zoom;
          const cy = Math.cos(cam25.yaw), sy = Math.sin(cam25.yaw);
          cam25.targetCx += (-dx * cy - dy * sy) * spd;
          cam25.targetCz += (dx * sy - dy * cy) * spd;
          cam25.targetCx = Math.max(MIN_CX, Math.min(MAX_CX, cam25.targetCx));
          cam25.targetCz = Math.max(MIN_CZ, Math.min(MAX_CZ, cam25.targetCz));
        }
      } else {
        cam3d.autoSpin = false;
        updateHudVisibility();
        cam3d.targetYaw -= dx * 0.0055 / Math.sqrt(cam3d.zoom);
        cam3d.targetPitch = Math.max(-1.35, Math.min(1.35, cam3d.targetPitch + dy * 0.0055 / Math.sqrt(cam3d.zoom)));
      }
    });

    ovCanvas.addEventListener("pointerup", e => {
      if (!dragMoved && e.button === 0) {
        const ch = screenToChunk(e.clientX, e.clientY);
        if (ch) {
          const owner = chunkOwnerMap.get(ch.cx + "," + ch.cz);
          if (owner) {
            selectedCountryId = owner.id;
            rebuildCountryOverlayTexture();
            renderSidebar();
            renderDossier();
          }
        }
      }
      dragMode = null;
      ovCanvas.classList.remove("dragging");
    });

    ovCanvas.addEventListener("wheel", e => {
      e.preventDefault();
      zoomBy(e.deltaY < 0 ? 1.18 : 1 / 1.18);
    }, { passive: false });

    // ---------------- Sidebar, Dossier & Button Bindings ----------------
    function fmtMoney(v) {
      return Number(v || 0).toLocaleString("ru-RU", { maximumFractionDigits: 2 });
    }
    function esc(s) {
      return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function renderSidebar() {
      const box = document.getElementById("sidebarContent");
      document.getElementById("countryControls").style.display = activeTab === "countries" ? "flex" : "none";

      if (activeTab === "countries") {
        const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
        const sortBy = document.getElementById("sortSelect").value;
        let list = [...(state.countries || [])];
        if (q) list = list.filter(c => c.name.toLowerCase().includes(q) || c.owner.toLowerCase().includes(q));
        list.sort((a, b) => {
          if (sortBy === "claims") return getCountryClaimCount(b) - getCountryClaimCount(a);
          if (sortBy === "rating") return (b.rating || 0) - (a.rating || 0);
          if (sortBy === "treasury") return (b.treasury || 0) - (a.treasury || 0);
          return (b.hourlyGdp || 0) - (a.hourlyGdp || 0);
        });
        if (!list.length) {
          box.innerHTML = `<div style="padding:16px;color:var(--muted);font-size:12px;">Стран пока нет.</div>`;
          return;
        }
        box.innerHTML = list.map(c => `
          <div class="country-row ${c.id === selectedCountryId ? "selected" : ""}" data-cid="${esc(c.id)}">
            <div class="swatch" style="background:${esc(c.color)}"></div>
            <div class="row-main">
              <div class="row-title">${c.wonders?.length ? "👑 " : ""}${esc(c.name)}</div>
              <div class="row-sub">
                <span>${c.online ? "🟢 Онлайн" : "⚫ Оффлайн"}</span>
                <span>⚑ ${getCountryClaimCount(c)} ч.</span>
                <span>★ ${Number(c.rating || 0).toFixed(1)}</span>
              </div>
            </div>
            <div class="row-gdp">
              <div>${fmtMoney(c.hourlyGdp)}/ч</div>
              <div style="font-size:10px;color:var(--muted);font-weight:500">${esc(c.currencyCode || "")}</div>
            </div>
          </div>
        `).join("");
        box.querySelectorAll(".country-row").forEach(el => {
          el.addEventListener("click", () => selectCountry(el.dataset.cid, true));
        });
      } else if (activeTab === "players") {
        const list = state.players || [];
        if (!list.length) {
          box.innerHTML = `<div style="padding:16px;color:var(--muted);font-size:12px;">Сейчас нет игроков онлайн.</div>`;
          return;
        }
        box.innerHTML = list.map(p => {
          const px = p.x ?? p.bx ?? 0;
          const pz = p.z ?? p.bz ?? 0;
          const pColor = p.color || p.countryColor || "#38bdf8";
          return `
          <div class="country-row" data-px="${p.cx}" data-pz="${p.cz}">
            <div class="swatch" style="background:${esc(pColor)}"></div>
            <div class="row-main">
              <div class="row-title">${esc(p.name)}</div>
              <div class="row-sub">
                <span>${p.countryName ? esc(p.countryName) : "Без страны"}</span>
                <span>X:${px} Z:${pz}</span>
              </div>
            </div>
          </div>
        `;
        }).join("");
        box.querySelectorAll(".country-row").forEach(el => {
          el.addEventListener("click", () => focusWorldChunk(Number(el.dataset.px), Number(el.dataset.pz)));
        });
      } else {
        const list = state.chronicle || [];
        if (!list.length) {
          box.innerHTML = `<div style="padding:16px;color:var(--muted);font-size:12px;">Хроника мира пока пуста.</div>`;
          return;
        }
        box.innerHTML = list.map(ev => `
          <div class="chronicle-item">
            <div class="chronicle-meta">
              <span class="badge">${esc(ev.category || "Событие")}</span>
              <span>${new Date(ev.timeMs || ev.timestampMs || Date.now()).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })}</span>
            </div>
            <div>${esc(ev.text || "")}</div>
          </div>
        `).join("");
      }
    }

    function selectCountry(cid, flyTo) {
      selectedCountryId = cid;
      rebuildCountryOverlayTexture();
      renderSidebar();
      renderDossier();
      const c = countryById.get(cid);
      if (c && flyTo) {
        const pt = getCountryCenter(c);
        if (pt) focusWorldChunk(pt.cx, pt.cz);
      }
    }

    function renderDossier() {
      const card = document.getElementById("dossier");
      const c = selectedCountryId ? countryById.get(selectedCountryId) : null;
      if (!c) {
        card.classList.add("hidden");
        return;
      }
      card.classList.remove("hidden");
      document.getElementById("dossierHeader").innerHTML = `
        <div style="display:flex;align-items:center;gap:9px;min-width:0;">
          <div style="width:14px;height:28px;border-radius:4px;background:${esc(c.color)};flex-shrink:0;"></div>
          <div style="min-width:0;">
            <div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(c.name)}</div>
            <div style="font-size:11px;color:var(--muted);">Глава: ${esc(c.owner)} · ${c.members} жит.</div>
          </div>
        </div>
        <button class="btn" id="closeDossierBtn">✕</button>
      `;
      document.getElementById("closeDossierBtn").onclick = () => {
        selectedCountryId = null;
        rebuildCountryOverlayTexture();
        renderSidebar();
        renderDossier();
      };

      const renderRelChips = (ids, cls) => {
        if (!ids || !ids.length) return `<span style="color:var(--muted)">Нет</span>`;
        return ids.map(id => {
          const other = countryById.get(id);
          const name = other ? other.name : id;
          return `<span class="chip ${cls}" data-rel="${esc(id)}">${esc(name)}</span>`;
        }).join("");
      };

      document.getElementById("dossierBody").innerHTML = `
        ${c.motd ? `<div style="padding:8px 10px;border-radius:8px;background:rgba(15,23,42,0.75);border:1px solid var(--border);font-style:italic;color:#cbd5e1;">«${esc(c.motd)}»</div>` : ""}
        <div class="stats-grid">
          <div class="stat-box"><div class="stat-label">ВВП / час</div><div class="stat-val" style="color:#fde68a">${fmtMoney(c.hourlyGdp)}</div></div>
          <div class="stat-box"><div class="stat-label">Казна</div><div class="stat-val" style="color:#86efac">${fmtMoney(c.treasury)}</div></div>
          <div class="stat-box"><div class="stat-label">Территория</div><div class="stat-val">${getCountryClaimCount(c)} чанк.</div></div>
          <div class="stat-box"><div class="stat-label">Здания / Вехи</div><div class="stat-val">${c.buildings || 0} / ${c.milestones || 0}</div></div>
          <div class="stat-box"><div class="stat-label">Валюта</div><div class="stat-val">${esc(c.currencySymbol || "")} ${esc(c.currencyCode || "")}</div></div>
          <div class="stat-box"><div class="stat-label">Рейтинг / Туристы</div><div class="stat-val">★ ${Number(c.rating || 0).toFixed(1)} (${c.visitors || 0})</div></div>
        </div>
        ${c.alliance ? `<div><div class="section-title">Альянс</div><span class="chip ally">🛡 ${esc(c.alliance)}</span></div>` : ""}
        ${c.wonders?.length ? `<div><div class="section-title">Чудеса света</div><div class="chip-wrap">${c.wonders.map(w => `<span class="chip wonder">🏛 ${esc(w)}</span>`).join("")}</div></div>` : ""}
        <div><div class="section-title">Союзники</div><div class="chip-wrap">${renderRelChips(c.allies, "ally")}</div></div>
        <div><div class="section-title">Торговые партнёры</div><div class="chip-wrap">${renderRelChips(c.tradePartners, "trade")}</div></div>
        <div><div class="section-title">Война / Враги</div><div class="chip-wrap">${renderRelChips(c.enemies, "enemy")}</div></div>
      `;
      document.getElementById("dossierBody").querySelectorAll(".chip[data-rel]").forEach(el => {
        el.addEventListener("click", () => {
          if (countryById.has(el.dataset.rel)) selectCountry(el.dataset.rel, true);
        });
      });
    }

    // Bind buttons
    document.querySelectorAll(".mode-btn").forEach(btn => btn.addEventListener("click", () => setViewMode(btn.dataset.view)));
    document.querySelectorAll("[data-layer]").forEach(btn => {
      btn.addEventListener("click", () => {
        const k = btn.dataset.layer;
        layers[k] = !layers[k];
        btn.classList.toggle("active", layers[k]);
        if (k === "territories" || k === "borders") rebuildCountryOverlayTexture();
      });
    });
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeTab = btn.dataset.tab;
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b === btn));
        renderSidebar();
      });
    });
    document.getElementById("searchInput").addEventListener("input", renderSidebar);
    document.getElementById("sortSelect").addEventListener("change", renderSidebar);
    document.getElementById("toggleSidebarBtn").addEventListener("click", () => {
      document.getElementById("sidebar").classList.toggle("collapsed");
    });
    document.getElementById("resetViewBtn").addEventListener("click", () => focusWorldChunk(0, 0, true));
    document.getElementById("refreshNowBtn").addEventListener("click", () => loadState(true));
    document.getElementById("pauseBtn").addEventListener("click", () => {
      paused = !paused;
      document.getElementById("pauseBtn").textContent = paused ? "▶ Старт" : "⏸ Пауза";
      document.getElementById("liveDot").classList.toggle("paused", paused);
    });
    document.getElementById("spinBtn").addEventListener("click", () => {
      cam3d.autoSpin = !cam3d.autoSpin;
      updateHudVisibility();
    });
    document.getElementById("tiltDownBtn").addEventListener("click", () => {
      cam25.targetPitch = Math.max(0.24, cam25.targetPitch - 0.14);
    });
    document.getElementById("tiltUpBtn").addEventListener("click", () => {
      cam25.targetPitch = Math.min(1.36, cam25.targetPitch + 0.14);
    });
    document.getElementById("rotLeftBtn").addEventListener("click", () => {
      if (viewMode === "25d") cam25.targetYaw -= 0.45;
      else { cam3d.autoSpin = false; cam3d.targetYaw -= 0.5; updateHudVisibility(); }
    });
    document.getElementById("rotRightBtn").addEventListener("click", () => {
      if (viewMode === "25d") cam25.targetYaw += 0.45;
      else { cam3d.autoSpin = false; cam3d.targetYaw += 0.5; updateHudVisibility(); }
    });
    document.getElementById("reliefBtn").addEventListener("click", () => {
      reliefIndex = (reliefIndex + 1) % reliefSteps.length;
      reliefMult = reliefSteps[reliefIndex];
      updateHudVisibility();
    });
    document.getElementById("zoomInBtn").addEventListener("click", () => zoomBy(1.35));
    document.getElementById("zoomOutBtn").addEventListener("click", () => zoomBy(1 / 1.35));
    document.getElementById("gistSaveBtn").addEventListener("click", () => {
      const val = document.getElementById("gistIdInput").value.trim();
      if (!val) return;
      gistId = val;
      localStorage.setItem("worldchill_gist_id", val);
      document.getElementById("gistSetupBanner").style.display = "none";
      loadState(true);
    });

    // ---------------- Main Animation Loop ----------------
    let lastTs = performance.now();
    function frame(ts) {
      const dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;
      const nowSec = ts * 0.001;
      const cssW = window.innerWidth;
      const cssH = window.innerHeight;

      // Smooth camera interpolation
      const k = 1 - Math.exp(-dt * 10);
      cam2d.cx += (cam2d.targetCx - cam2d.cx) * k;
      cam2d.cz += (cam2d.targetCz - cam2d.cz) * k;
      cam2d.zoom += (cam2d.targetZoom - cam2d.zoom) * k;

      cam25.cx += (cam25.targetCx - cam25.cx) * k;
      cam25.cz += (cam25.targetCz - cam25.cz) * k;
      cam25.zoom += (cam25.targetZoom - cam25.zoom) * k;
      cam25.yaw += (cam25.targetYaw - cam25.yaw) * k;
      cam25.pitch += (cam25.targetPitch - cam25.pitch) * k;

      if (viewMode === "3d" && cam3d.autoSpin && !dragMode) {
        cam3d.targetYaw += dt * 0.065;
      }
      cam3d.yaw += (cam3d.targetYaw - cam3d.yaw) * k;
      cam3d.pitch += (cam3d.targetPitch - cam3d.pitch) * k;
      cam3d.zoom += (cam3d.targetZoom - cam3d.zoom) * k;

      let viewInfo = null;
      if (viewMode === "25d") {
        viewInfo = renderWebGL25D(cssW, cssH, nowSec);
        last25View = viewInfo;
      } else if (viewMode === "3d") {
        viewInfo = renderWebGL3D(cssW, cssH, nowSec);
      }

      drawOverlayAnd2D(cssW, cssH, nowSec, viewInfo);
      requestAnimationFrame(frame);
    }

    // Boot
    setViewMode(viewMode);
    loadStaticTerrain().then(() => loadState(true)).then(() => {
      schedulePoll();
      requestAnimationFrame(frame);
    });
  </script>
</body>
</html>
