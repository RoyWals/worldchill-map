<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorldChill Earth — Live Политическая карта</title>
  <style>
    :root {
      --bg: #080d18;
      --panel: rgba(13, 21, 38, 0.88);
      --panel-solid: #0f182c;
      --border: rgba(148, 163, 184, 0.18);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --gold: #f59e0b;
      --green: #22c55e;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      user-select: none;
    }
    canvas#map {
      position: fixed; inset: 0; width: 100%; height: 100%;
      cursor: grab; display: block;
    }
    canvas#map.dragging { cursor: grabbing; }

    /* Top bar */
    .topbar {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 20;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      pointer-events: none; flex-wrap: wrap;
    }
    .bar-group {
      pointer-events: auto;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      background: var(--panel); backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 7px 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    .brand { font-weight: 700; font-size: 14px; letter-spacing: 0.2px; display: flex; align-items: center; gap: 8px; }
    .live-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: #cbd5e1; padding: 3px 9px; border-radius: 999px;
      background: rgba(15, 23, 42, 0.75); border: 1px solid var(--border);
    }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--green);
      box-shadow: 0 0 8px var(--green); animation: pulse 1.8s infinite;
    }
    .live-dot.paused { background: var(--gold); box-shadow: none; animation: none; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.45;transform:scale(.82)} }

    .btn {
      background: rgba(30, 41, 59, 0.78); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 5px 10px; font-size: 12px; font-weight: 500; cursor: pointer;
      transition: 0.15s ease;
    }
    .btn:hover { background: rgba(51, 65, 85, 0.92); border-color: rgba(148, 163, 184, 0.35); }
    .btn.active { background: rgba(14, 116, 144, 0.48); border-color: var(--accent); color: #e0f2fe; }

    /* Left Sidebar */
    .sidebar {
      position: fixed; top: 68px; left: 12px; bottom: 52px; width: 325px; z-index: 15;
      background: var(--panel); backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: 14px;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.5);
      transition: transform 0.22s ease, opacity 0.22s ease;
    }
    .sidebar.collapsed { transform: translateX(-350px); opacity: 0; pointer-events: none; }
    .tabs { display: flex; border-bottom: 1px solid var(--border); }
    .tab-btn {
      flex: 1; padding: 10px 8px; font-size: 12px; font-weight: 600;
      background: transparent; border: none; color: var(--muted); cursor: pointer;
      border-bottom: 2px solid transparent; transition: 0.15s;
    }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); background: rgba(56, 189, 248, 0.08); }

    .controls {
      padding: 10px; display: flex; gap: 6px; border-bottom: 1px solid var(--border);
    }
    .input, .select {
      background: rgba(15, 23, 42, 0.9); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12px;
      outline: none;
    }
    .input { flex: 1; min-width: 0; }
    .input:focus, .select:focus { border-color: var(--accent); }
    .scroll-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .scroll-list::-webkit-scrollbar { width: 6px; }
    .scroll-list::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.28); border-radius: 99px; }

    .country-row {
      display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 10px;
      background: rgba(15, 23, 42, 0.55); border: 1px solid rgba(148, 163, 184, 0.1);
      cursor: pointer; transition: 0.15s;
    }
    .country-row:hover { background: rgba(30, 41, 59, 0.8); border-color: rgba(148, 163, 184, 0.28); }
    .country-row.selected { background: rgba(14, 116, 144, 0.3); border-color: var(--accent); }
    .swatch { width: 12px; height: 28px; border-radius: 4px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.25); }
    .row-main { flex: 1; min-width: 0; }
    .row-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-sub { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
    .row-gdp { text-align: right; font-size: 12px; font-weight: 700; color: #fde68a; white-space: nowrap; }

    .chronicle-item {
      padding: 8px 10px; border-radius: 9px; background: rgba(15, 23, 42, 0.55);
      border-left: 3px solid var(--accent); font-size: 12px; line-height: 1.4;
    }
    .chronicle-meta { font-size: 10px; color: var(--muted); margin-bottom: 3px; display: flex; justify-content: space-between; }
    .badge {
      display: inline-block; padding: 2px 6px; border-radius: 5px; font-size: 10px; font-weight: 600;
      background: rgba(56, 189, 248, 0.18); color: #7dd3fc;
    }

    /* Right Country Dossier */
    .dossier {
      position: fixed; top: 68px; right: 12px; width: 340px; max-height: calc(100% - 120px); z-index: 16;
      background: var(--panel); backdrop-filter: blur(14px);
      border: 1px solid var(--border); border-radius: 14px;
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.55);
      display: flex; flex-direction: column; overflow: hidden;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .dossier.hidden { transform: translateX(370px); opacity: 0; pointer-events: none; }
    .dossier-header {
      padding: 12px 14px; border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    }
    .dossier-body { padding: 12px 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 12px; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-box {
      background: rgba(15, 23, 42, 0.7); border: 1px solid var(--border);
      border-radius: 9px; padding: 8px 10px;
    }
    .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .stat-val { font-size: 14px; font-weight: 700; margin-top: 2px; }
    .section-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
    .chip-wrap { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip {
      padding: 3px 8px; border-radius: 999px; font-size: 11px;
      background: rgba(30, 41, 59, 0.9); border: 1px solid var(--border); cursor: pointer;
    }
    .chip:hover { border-color: var(--accent); }
    .chip.ally { border-color: rgba(34, 197, 94, 0.45); color: #86efac; }
    .chip.trade { border-color: rgba(245, 158, 11, 0.45); color: #fde68a; }
    .chip.enemy { border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; }
    .chip.wonder { border-color: rgba(168, 85, 247, 0.45); color: #e9d5ff; cursor: default; }

    /* Bottom HUD */
    .bottom-hud {
      position: fixed; bottom: 12px; left: 12px; right: 12px; z-index: 15;
      display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none;
    }
    .hud-box {
      pointer-events: auto; background: var(--panel); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 7px 12px; font-size: 12px; display: flex; align-items: center; gap: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .zoom-controls { display: flex; gap: 5px; }
    @media (max-width: 780px) {
      .sidebar { width: calc(100% - 24px); max-height: 44%; bottom: 56px; top: auto; }
      .dossier { width: calc(100% - 24px); top: 68px; max-height: 45%; }
    }
  </style>
</head>
<body>
  <canvas id="map"></canvas>

  <div class="topbar">
    <div class="bar-group">
      <button class="btn" id="toggleSidebarBtn" title="Скрыть/показать панель">☰ Панель</button>
      <div class="brand">🌍 WorldChill Earth</div>
      <div class="live-pill">
        <span class="live-dot" id="liveDot"></span>
        <span id="liveStats">Загрузка...</span>
      </div>
    </div>

    <div class="bar-group">
      <button class="btn active" data-layer="borders">Границы</button>
      <button class="btn active" data-layer="diplomacy">Союзы и торговля</button>
      <button class="btn active" data-layer="capitals">Столицы</button>
      <button class="btn active" data-layer="players">Игроки</button>
      <button class="btn" data-layer="grid">Сетка чанков</button>
      <button class="btn" id="resetViewBtn">Весь мир</button>
      <button class="btn" id="refreshNowBtn" title="Обновить данные сейчас">⟳ Обновить</button>
      <button class="btn" id="pauseBtn">⏸ Пауза</button>
    </div>
  </div>

  <div id="gistSetupBanner" style="display:none;position:fixed;top:68px;right:12px;z-index:25;max-width:340px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:12px;padding:12px;box-shadow:0 12px 30px rgba(0,0,0,0.5);">
    <div style="font-weight:700;font-size:13px;margin-bottom:6px;color:var(--gold);">Подключение GitHub Gist</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.4;">Укажите Gist ID (или откройте ссылку из команды <b>/c webmap</b> с параметром <code>?gist=...</code>):</div>
    <div style="display:flex;gap:6px;">
      <input class="input" id="gistIdInput" type="text" placeholder="Вставьте Gist ID..." />
      <button class="btn active" id="gistSaveBtn">OK</button>
    </div>
  </div>

  <aside class="sidebar" id="sidebar">
    <div class="tabs">
      <button class="tab-btn active" data-tab="countries">Страны</button>
      <button class="tab-btn" data-tab="players">Игроки</button>
      <button class="tab-btn" data-tab="chronicle">Хроника мира</button>
    </div>

    <div class="controls" id="countryControls">
      <input class="input" id="searchInput" type="text" placeholder="Поиск страны..." />
      <select class="select" id="sortSelect">
        <option value="gdp">По ВВП</option>
        <option value="claims">По чанкам</option>
        <option value="rating">По звёздам ★</option>
        <option value="treasury">По казне</option>
      </select>
    </div>

    <div class="scroll-list" id="sidebarContent"></div>
  </aside>

  <section class="dossier hidden" id="dossier">
    <div class="dossier-header" id="dossierHeader"></div>
    <div class="dossier-body" id="dossierBody"></div>
  </section>

  <div class="bottom-hud">
    <div class="hud-box" id="hoverHud">
      <span id="hoverCoords">Наведите курсор на карту Земли</span>
      <span id="hoverOwner" style="font-weight:600"></span>
    </div>
    <div class="hud-box zoom-controls">
      <button class="btn" id="zoomOutBtn">−</button>
      <span id="zoomLabel" style="min-width:44px;text-align:center;color:var(--muted)">100%</span>
      <button class="btn" id="zoomInBtn">+</button>
    </div>
  </div>

  <script>
    const TERRAIN_NAMES = [
      "Глубокий океан",
      "Вода / побережье",
      "Снег / льды",
      "Лес / джунгли",
      "Пустыня / степь",
      "Суша / равнина",
      "За границей карты"
    ];

    const canvas = document.getElementById("map");
    const ctx = canvas.getContext("2d");

    const DEFAULT_GIST_ID = "6c8f6446cb803cd6d773559fb5a3e13b";
    const urlParams = new URLSearchParams(window.location.search);
    const paramGist = (urlParams.get("gist") || "").trim();
    if (paramGist) {
      try { localStorage.setItem("worldchill_gist_id", paramGist); } catch (_) {}
    }
    let storedGist = "";
    try { storedGist = (localStorage.getItem("worldchill_gist_id") || "").trim(); } catch (_) {}
    let gistId = paramGist || DEFAULT_GIST_ID || (location.hostname.endsWith("github.io") ? storedGist : "");
    let isGistMode = gistId.length > 0 || location.hostname.endsWith("github.io") || location.protocol === "file:";
    let lastGistEtag = null;
    let gistRawFallbackUntil = 0;

    let terrainImg = new Image();
    let terrainReady = false;
    let biomeBytes = null;
    let state = null;
    let ownerGrid = null; // Int16Array(768*384) -> index into state.countries or -1
    let countryMap = new Map();
    let capitalMap = new Map();
    let selectedCountryId = null;
    let hoveredCountryId = null;
    let activeTab = "countries";
    let paused = false;
    let pollTimer = null;

    const layers = {
      borders: true,
      diplomacy: true,
      capitals: true,
      players: true,
      grid: false
    };

    const cam = {
      x: 384, // world chunk grid center [0..768]
      z: 192, // world chunk grid center [0..384]
      scale: 2.0, // screen pixels per chunk
      anim: null
    };

    function esc(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function fmt(num) {
      if (num === null || num === undefined || Number.isNaN(num)) return "0";
      const n = Number(num);
      return Math.abs(n - Math.round(n)) < 0.005 ? Math.round(n).toLocaleString("ru-RU") : n.toFixed(2);
    }

    function hexToRgba(hex, alpha) {
      const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || "#38bdf8");
      if (!m) return `rgba(56,189,248,${alpha})`;
      return `rgba(${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)},${alpha})`;
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function fitWorld() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const sx = (w * 0.86) / 768;
      const sy = (h * 0.82) / 384;
      cam.scale = Math.max(1.0, Math.min(sx, sy));
      cam.x = 384;
      cam.z = 192;
      cam.anim = null;
      updateZoomLabel();
      draw();
    }

    function updateZoomLabel() {
      document.getElementById("zoomLabel").textContent = Math.round(cam.scale * 50) + "%";
    }

    function worldToScreen(gx, gz) {
      return {
        x: window.innerWidth / 2 + (gx - cam.x) * cam.scale,
        y: window.innerHeight / 2 + (gz - cam.z) * cam.scale
      };
    }

    function screenToWorld(sx, sy) {
      return {
        gx: cam.x + (sx - window.innerWidth / 2) / cam.scale,
        gz: cam.z + (sy - window.innerHeight / 2) / cam.scale
      };
    }

    function animateTo(gx, gz, targetScale) {
      cam.anim = {
        sx: cam.x, sz: cam.z, ss: cam.scale,
        tx: gx, tz: gz, ts: Math.max(cam.scale, targetScale),
        start: performance.now(), duration: 420
      };
      requestAnimationFrame(stepAnim);
    }

    function stepAnim(now) {
      if (!cam.anim) return;
      const t = Math.min(1, (now - cam.anim.start) / cam.anim.duration);
      const ease = 1 - Math.pow(1 - t, 3);
      cam.x = cam.anim.sx + (cam.anim.tx - cam.anim.sx) * ease;
      cam.z = cam.anim.sz + (cam.anim.tz - cam.anim.sz) * ease;
      cam.scale = cam.anim.ss + (cam.anim.ts - cam.anim.ss) * ease;
      updateZoomLabel();
      draw();
      if (t < 1) {
        requestAnimationFrame(stepAnim);
      } else {
        cam.anim = null;
      }
    }

    function rebuildIndexes() {
      if (!state || !state.world) return;
      const w = state.world.width;
      const h = state.world.height;
      const minX = state.world.minChunkX;
      const minZ = state.world.minChunkZ;
      ownerGrid = new Int16Array(w * h);
      ownerGrid.fill(-1);
      countryMap.clear();
      capitalMap.clear();

      state.countries.forEach((c, idx) => {
        countryMap.set(c.id, c);
        let sumX = 0, sumZ = 0, count = 0;
        const cl = c.claims || [];
        for (let i = 0; i + 1 < cl.length; i += 2) {
          const gx = cl[i] - minX;
          const gz = cl[i + 1] - minZ;
          if (gx >= 0 && gx < w && gz >= 0 && gz < h) {
            ownerGrid[gz * w + gx] = idx;
            sumX += gx + 0.5;
            sumZ += gz + 0.5;
            count++;
          }
        }
        if (c.spawn) {
          capitalMap.set(c.id, {
            gx: c.spawn.cx - minX + 0.5,
            gz: c.spawn.cz - minZ + 0.5
          });
        } else if (count > 0) {
          capitalMap.set(c.id, { gx: sumX / count, gz: sumZ / count });
        }
      });
    }

    function draw() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      ctx.clearRect(0, 0, vw, vh);
      ctx.fillStyle = "#060b16";
      ctx.fillRect(0, 0, vw, vh);

      const minX = state ? state.world.minChunkX : -384;
      const minZ = state ? state.world.minChunkZ : -192;
      const gw = state ? state.world.width : 768;
      const gh = state ? state.world.height : 384;

      const topLeft = worldToScreen(0, 0);
      const mapW = gw * cam.scale;
      const mapH = gh * cam.scale;

      if (terrainReady) {
        ctx.imageSmoothingEnabled = cam.scale < 2.2;
        ctx.drawImage(terrainImg, topLeft.x, topLeft.y, mapW, mapH);
      }

      // Frame around Earth world
      ctx.strokeStyle = "rgba(56, 189, 248, 0.35)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(topLeft.x, topLeft.y, mapW, mapH);

      // Optional chunk grid when zoomed in
      if (layers.grid && cam.scale >= 6) {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        const startGx = Math.max(0, Math.floor(screenToWorld(0, 0).gx));
        const endGx = Math.min(gw, Math.ceil(screenToWorld(vw, 0).gx));
        const startGz = Math.max(0, Math.floor(screenToWorld(0, 0).gz));
        const endGz = Math.min(gh, Math.ceil(screenToWorld(0, vh).gz));
        for (let gx = startGx; gx <= endGx; gx++) {
          const sx = topLeft.x + gx * cam.scale;
          ctx.moveTo(sx, topLeft.y + startGz * cam.scale);
          ctx.lineTo(sx, topLeft.y + endGz * cam.scale);
        }
        for (let gz = startGz; gz <= endGz; gz++) {
          const sy = topLeft.y + gz * cam.scale;
          ctx.moveTo(topLeft.x + startGx * cam.scale, sy);
          ctx.lineTo(topLeft.x + endGx * cam.scale, sy);
        }
        ctx.stroke();
      }

      if (!state) return;

      // Territory fills and crisp outer borders
      if (layers.borders && ownerGrid) {
        const s = cam.scale;
        const pad = s > 4 ? 0.35 : 0; // avoids hairline seams when zoomed in
        state.countries.forEach((c, idx) => {
          const isFocus = c.id === selectedCountryId || c.id === hoveredCountryId;
          ctx.fillStyle = hexToRgba(c.color, isFocus ? 0.68 : 0.45);
          const cl = c.claims || [];
          for (let i = 0; i + 1 < cl.length; i += 2) {
            const gx = cl[i] - minX;
            const gz = cl[i + 1] - minZ;
            if (gx < 0 || gx >= gw || gz < 0 || gz >= gh) continue;
            const sx = topLeft.x + gx * s;
            const sy = topLeft.y + gz * s;
            if (sx + s < 0 || sy + s < 0 || sx > vw || sy > vh) continue;
            ctx.fillRect(sx, sy, s + pad, s + pad);
          }

          // Perimeter edges only
          ctx.strokeStyle = isFocus ? "#ffffff" : c.color;
          ctx.lineWidth = isFocus ? Math.max(2.0, Math.min(3.5, s * 0.22)) : Math.max(1.2, Math.min(2.4, s * 0.16));
          ctx.beginPath();
          for (let i = 0; i + 1 < cl.length; i += 2) {
            const gx = cl[i] - minX;
            const gz = cl[i + 1] - minZ;
            if (gx < 0 || gx >= gw || gz < 0 || gz >= gh) continue;
            const sx = topLeft.x + gx * s;
            const sy = topLeft.y + gz * s;
            if (sx + s < -4 || sy + s < -4 || sx > vw + 4 || sy > vh + 4) continue;
            if (gx === 0 || ownerGrid[gz * gw + (gx - 1)] !== idx) {
              ctx.moveTo(sx, sy); ctx.lineTo(sx, sy + s);
            }
            if (gx === gw - 1 || ownerGrid[gz * gw + (gx + 1)] !== idx) {
              ctx.moveTo(sx + s, sy); ctx.lineTo(sx + s, sy + s);
            }
            if (gz === 0 || ownerGrid[(gz - 1) * gw + gx] !== idx) {
              ctx.moveTo(sx, sy); ctx.lineTo(sx + s, sy);
            }
            if (gz === gh - 1 || ownerGrid[(gz + 1) * gw + gx] !== idx) {
              ctx.moveTo(sx, sy + s); ctx.lineTo(sx + s, sy + s);
            }
          }
          ctx.stroke();
        });
      }

      // Diplomacy arcs (allies, trade, enemies)
      if (layers.diplomacy) {
        const drawnPairs = new Set();
        for (const c of state.countries) {
          const p1 = capitalMap.get(c.id);
          if (!p1) continue;
          const s1 = worldToScreen(p1.gx, p1.gz);

          const drawRel = (targets, color, dashed, width, bend) => {
            for (const tid of (targets || [])) {
              const pairKey = [c.id, tid].sort().join("|") + color;
              if (drawnPairs.has(pairKey)) continue;
              drawnPairs.add(pairKey);
              const p2 = capitalMap.get(tid);
              if (!p2) continue;
              const s2 = worldToScreen(p2.gx, p2.gz);
              const mx = (s1.x + s2.x) / 2;
              const my = (s1.y + s2.y) / 2 - Math.hypot(s2.x - s1.x, s2.y - s1.y) * bend;
              ctx.save();
              ctx.strokeStyle = color;
              ctx.lineWidth = width;
              if (dashed) ctx.setLineDash([6, 5]);
              ctx.beginPath();
              ctx.moveTo(s1.x, s1.y);
              ctx.quadraticCurveTo(mx, my, s2.x, s2.y);
              ctx.stroke();
              ctx.restore();
            }
          };

          drawRel(c.tradePartners, "rgba(251, 191, 36, 0.72)", true, 1.5, 0.14);
          drawRel(c.allies, "rgba(52, 211, 153, 0.82)", false, 2.0, 0.08);
          drawRel(c.enemies, "rgba(248, 113, 113, 0.9)", true, 2.2, 0.18);
        }
      }

      // Capitals & names
      if (layers.capitals) {
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for (const c of state.countries) {
          const cap = capitalMap.get(c.id);
          if (!cap) continue;
          const pt = worldToScreen(cap.gx, cap.gz);
          if (pt.x < -80 || pt.y < -40 || pt.x > vw + 80 || pt.y > vh + 40) continue;

          const selected = c.id === selectedCountryId;
          ctx.fillStyle = selected ? "#ffffff" : c.color;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, selected ? 5.5 : 4.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#080d18";
          ctx.lineWidth = 1.6;
          ctx.stroke();

          if (cam.scale >= 1.5 || selected || (c.claims && c.claims.length >= 4)) {
            const label = (c.spawn ? "★ " : "") + c.name;
            ctx.font = selected ? "700 12px sans-serif" : "600 11px sans-serif";
            const tw = ctx.measureText(label).width;
            const bx = pt.x - tw / 2 - 6;
            const by = pt.y - 22;
            ctx.fillStyle = selected ? "rgba(14, 116, 144, 0.92)" : "rgba(8, 13, 24, 0.8)";
            ctx.beginPath();
            ctx.roundRect(bx, by, tw + 12, 16, 5);
            ctx.fill();
            ctx.strokeStyle = selected ? "#38bdf8" : hexToRgba(c.color, 0.75);
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.fillStyle = "#f8fafc";
            ctx.fillText(label, pt.x, by + 8.5);
          }
        }
      }

      // Online players
      if (layers.players && state.players) {
        for (const p of state.players) {
          const gx = (p.x / 16) - minX;
          const gz = (p.z / 16) - minZ;
          const pt = worldToScreen(gx, gz);
          if (pt.x < -40 || pt.y < -40 || pt.x > vw + 40 || pt.y > vh + 40) continue;

          ctx.fillStyle = "rgba(56, 189, 248, 0.25)";
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 9, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#f8fafc";
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 4.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = p.color || "#38bdf8";
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.font = "600 11px sans-serif";
          ctx.textAlign = "center";
          ctx.fillStyle = "#e2e8f0";
          ctx.fillText(p.name, pt.x, pt.y + 15);
        }
      }
    }

    function renderSidebar() {
      const container = document.getElementById("sidebarContent");
      const controls = document.getElementById("countryControls");

        controls.style.display = "flex";

          if (sortBy === "claims") return (b.claims.length / 2) - (a.claims.length / 2);
          if (sortBy === "rating") return (b.rating - a.rating) || (b.ratingCount - a.ratingCount);
          if (sortBy === "treasury") return b.treasury - a.treasury;

    window.focusCountry = function(id) {
      selectedCountryId = id;
      const cap = capitalMap.get(id);
      if (cap) {
        animateTo(cap.gx, cap.gz, Math.max(cam.scale, 6.5));
      }

      renderDossier();

    window.flyToBlock = function(bx, bz) {
      if (!state) return;
      const gx = (bx / 16) - state.world.minChunkX;
      const gz = (bz / 16) - state.world.minChunkZ;
      animateTo(gx, gz, Math.max(cam.scale, 8.0));
    };

      selectedCountryId = null;
      renderSidebar();
      renderDossier();
      draw();
    };

    function schedulePoll(ms) {
      clearTimeout(pollTimer);
      if (!paused) {
        pollTimer = setTimeout(fetchState, ms);
      }
    }

    function applyState(nextState) {
      state = nextState;
      rebuildIndexes();
      const totalChunks = state.countries.reduce((acc, c) => acc + Math.floor((c.claims || []).length / 2), 0);
      const playersCount = (state.players || []).length;
      const suffix = gistId ? " (Gist)" : "";
      document.getElementById("liveStats").textContent =
        `${playersCount} онл. • ${state.countries.length} стран • ${totalChunks} ч.${suffix}`;
      renderSidebar();
      renderDossier();
      draw();
    }

    async function fetchFromGist(forceManual) {
      if (!gistId) {
        document.getElementById("liveStats").textContent = "Укажите Gist ID";
        document.getElementById("gistSetupBanner").style.display = "block";
        return;
      }
      document.getElementById("gistSetupBanner").style.display = "none";

      const useRawOnly = !forceManual && Date.now() < gistRawFallbackUntil;
      if (!useRawOnly) {
        const headers = {};
        if (lastGistEtag && !forceManual) {
          headers["If-None-Match"] = lastGistEtag;
        }
        const res = await fetch(`https://api.github.com/gists/${encodeURIComponent(gistId)}`, {
          cache: "no-store",
          headers
        });
        if (res.status === 304) {
          schedulePoll(Math.max(10000, (state && state.gistPollMs) || 20000));
          return;
        }
        if (res.ok) {
          const etag = res.headers.get("ETag");
          if (etag) lastGistEtag = etag;
          const gistData = await res.json();
          const files = gistData && gistData.files ? gistData.files : {};
          const file = files["worldchill-state.json"] || Object.values(files)[0];
          if (file) {
            let parsed;
            if (file.truncated && file.raw_url) {
              const rawRes = await fetch(file.raw_url, { cache: "no-store" });
              parsed = await rawRes.json();
            } else if (file.content) {
              parsed = JSON.parse(file.content);
            }
            if (parsed) {
              applyState(parsed);
            }
          }
          schedulePoll(Math.max(10000, (state && state.gistPollMs) || 20000));
          return;
        }
        if (res.status === 403 || res.status === 429) {
          gistRawFallbackUntil = Date.now() + 10 * 60 * 1000;
        }
      }

      const rawRes = await fetch(
        `https://gist.githubusercontent.com/raw/${encodeURIComponent(gistId)}/worldchill-state.json?t=${Date.now()}`,
        { cache: "no-store" }
      );
      if (rawRes.ok) {
        applyState(await rawRes.json());
      }
      schedulePoll(Math.max(15000, (state && state.gistPollMs) || 20000));
    }

    async function fetchState(forceManual = false) {
      if (paused && !forceManual) return;
      try {
        if (gistId || isGistMode) {
          await fetchFromGist(forceManual);
          return;
        }
        const res = await fetch("/api/state", { cache: "no-store" });
        if (!res.ok) {
          schedulePoll(3000);
          return;
        }
        applyState(await res.json());
        const nextMs = Math.max(1000, state.refreshMs || 2000);
        schedulePoll(nextMs);
      } catch (e) {
        schedulePoll(gistId ? 20000 : 3000);
      }
    }

    // Mouse / Pan / Zoom interactions
    let dragging = false;
    let dragMoved = 0;
    let lastX = 0, lastY = 0;

    canvas.addEventListener("mousedown", e => {
      if (e.button !== 0) return;
      dragging = true;
      dragMoved = 0;
      lastX = e.clientX;
      lastY = e.clientY;
      cam.anim = null;
      canvas.classList.add("dragging");
    });

    window.addEventListener("mousemove", e => {
      if (dragging) {
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        dragMoved += Math.abs(dx) + Math.abs(dy);
        cam.x -= dx / cam.scale;
        cam.z -= dy / cam.scale;
        lastX = e.clientX;
        lastY = e.clientY;
        draw();
        return;
      }

      if (!state) return;
      const wpos = screenToWorld(e.clientX, e.clientY);
      const gx = Math.floor(wpos.gx);
      const gz = Math.floor(wpos.gz);
      const gw = state.world.width;
      const gh = state.world.height;

      let nextHover = null;
      if (gx >= 0 && gx < gw && gz >= 0 && gz < gh) {
        const cx = gx + state.world.minChunkX;
        const cz = gz + state.world.minChunkZ;
        const bx = cx * 16 + 8;
        const bz = cz * 16 + 8;
        let biome = "";
        if (biomeBytes && biomeBytes.length === gw * gh) {
          const code = biomeBytes[gz * gw + gx];
          biome = TERRAIN_NAMES[code] || "";
        }
        document.getElementById("hoverCoords").textContent =
          `X:${bx}, Z:${bz} (чанк ${cx}, ${cz})${biome ? " • " + biome : ""}`;

        const idx = ownerGrid ? ownerGrid[gz * gw + gx] : -1;
        if (idx >= 0 && state.countries[idx]) {
          const c = state.countries[idx];
          nextHover = c.id;
          document.getElementById("hoverOwner").innerHTML =
            `<span style="color:${esc(c.color)}">■</span> ${esc(c.name)} (${fmt(c.hourlyGdp)}/ч)`;
        } else {
          document.getElementById("hoverOwner").textContent = "Ничья земля";
        }
      } else {
        document.getElementById("hoverCoords").textContent = "За границей карты";
        document.getElementById("hoverOwner").textContent = "";
      }

      if (nextHover !== hoveredCountryId) {
        hoveredCountryId = nextHover;
        draw();
      }
    });

    function findCountryAtScreen(sx, sy) {
      if (!state) return null;
      if (layers.capitals) {
        let bestId = null;
        let bestDist = 14;
        for (const c of state.countries) {
          const cap = capitalMap.get(c.id);
          if (!cap) continue;
          const pt = worldToScreen(cap.gx, cap.gz);
          const d = Math.hypot(pt.x - sx, pt.y - sy);
          if (d <= bestDist) {
            bestDist = d;
            bestId = c.id;
          }
        }
        if (bestId) return bestId;
      }
      if (ownerGrid) {
        const wpos = screenToWorld(sx, sy);
        const gx = Math.floor(wpos.gx);
        const gz = Math.floor(wpos.gz);
        const gw = state.world.width;
        const gh = state.world.height;
        if (gx >= 0 && gx < gw && gz >= 0 && gz < gh) {
          const idx = ownerGrid[gz * gw + gx];
          if (idx >= 0 && state.countries[idx]) {
            return state.countries[idx].id;
          }
        }
      }
      return null;
    }

    window.addEventListener("mouseup", e => {
      if (!dragging) return;
      dragging = false;
      canvas.classList.remove("dragging");
      if (dragMoved <= 5 && state) {
        selectedCountryId = findCountryAtScreen(e.clientX, e.clientY);
        renderSidebar();
        renderDossier();
        draw();
      }
    });

    canvas.addEventListener("touchstart", e => {
      if (e.touches.length === 1) {
        dragging = true;
        dragMoved = 0;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
        cam.anim = null;
      }
    }, { passive: true });

    canvas.addEventListener("touchmove", e => {
      if (!dragging || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - lastX;
      const dy = e.touches[0].clientY - lastY;
      dragMoved += Math.abs(dx) + Math.abs(dy);
      cam.x -= dx / cam.scale;
      cam.z -= dy / cam.scale;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
      draw();
    }, { passive: true });

    canvas.addEventListener("touchend", e => {
      if (!dragging) return;
      dragging = false;
      if (dragMoved <= 8 && state && e.changedTouches.length > 0) {
        selectedCountryId = findCountryAtScreen(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
        renderSidebar();
        renderDossier();
        draw();
      }
    });

    canvas.addEventListener("wheel", e => {
      e.preventDefault();
      cam.anim = null;
      const factor = e.deltaY < 0 ? 1.18 : 1 / 1.18;
      const before = screenToWorld(e.clientX, e.clientY);
      cam.scale = Math.max(0.7, Math.min(48, cam.scale * factor));
      const after = screenToWorld(e.clientX, e.clientY);
      cam.x += before.gx - after.gx;
      cam.z += before.gz - after.gz;
      updateZoomLabel();
      draw();
    }, { passive: false });

    // Toolbar actions
    document.querySelectorAll("[data-layer]").forEach(btn => {
      btn.addEventListener("click", () => {
        const key = btn.dataset.layer;
        layers[key] = !layers[key];
        btn.classList.toggle("active", layers[key]);
        draw();
      });
    });

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeTab = btn.dataset.tab;
        renderSidebar();
      });
    });

    document.getElementById("searchInput").addEventListener("input", renderSidebar);
    document.getElementById("sortSelect").addEventListener("change", renderSidebar);
    document.getElementById("toggleSidebarBtn").addEventListener("click", () => {
      document.getElementById("sidebar").classList.toggle("collapsed");
    });
    document.getElementById("resetViewBtn").addEventListener("click", fitWorld);
    document.getElementById("zoomInBtn").addEventListener("click", () => {
      cam.scale = Math.min(48, cam.scale * 1.3);
      updateZoomLabel();
      draw();
    });
    document.getElementById("zoomOutBtn").addEventListener("click", () => {
      cam.scale = Math.max(0.7, cam.scale / 1.3);
      updateZoomLabel();
      draw();
    });
    document.getElementById("refreshNowBtn").addEventListener("click", () => {
      fetchState(true);
    });
    document.getElementById("gistSaveBtn").addEventListener("click", () => {
      const val = (document.getElementById("gistIdInput").value || "").trim();
      if (!val) return;
      gistId = val;
      isGistMode = true;
      lastGistEtag = null;
      gistRawFallbackUntil = 0;
      try { localStorage.setItem("worldchill_gist_id", val); } catch (_) {}
      const u = new URL(window.location.href);
      u.searchParams.set("gist", val);
      history.replaceState(null, "", u.toString());
      fetchState(true);
    });
    document.getElementById("pauseBtn").addEventListener("click", () => {
      paused = !paused;
      const btn = document.getElementById("pauseBtn");
      const dot = document.getElementById("liveDot");
      btn.textContent = paused ? "▶ Продолжить" : "⏸ Пауза";
      dot.classList.toggle("paused", paused);
      if (!paused) fetchState(true);
    });

    // Startup
    window.addEventListener("resize", resizeCanvas);
    terrainImg.onload = () => { terrainReady = true; draw(); };
    terrainImg.onerror = () => {
      if (!terrainImg.dataset.fallbackTried) {
        terrainImg.dataset.fallbackTried = "1";
        terrainImg.src = "./terrain.png";
      }
    };
    terrainImg.src = isGistMode ? "./terrain.png" : "/api/terrain.png";
    fetch(isGistMode ? "./biomes.bin" : "/api/biomes")
      .then(r => r.ok ? r.arrayBuffer() : fetch("./biomes.bin").then(r2 => r2.ok ? r2.arrayBuffer() : null))
      .then(buf => {
        if (buf) biomeBytes = new Uint8Array(buf);
      }).catch(() => {});

    resizeCanvas();
    fitWorld();
    fetchState();
  </script>
</body>
</html>
